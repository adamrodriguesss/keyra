# Local development settings. Copy to config/application.properties (gitignored):
#   cp config/application.example.properties config/application.properties
# Spring Boot loads ./config/application.properties from the working directory, so it applies to every
# local launch (IDE, spring-boot:run, test-run). It is not packaged into the jar; never copy it into a
# deployed image.
keyra.issuer-url=http://localhost:8080
keyra.bootstrap.admin-email=admin@keyra.local
keyra.bootstrap.admin-password=local-admin-password

# Signing key. The default generates a throwaway key on every start, so tokens stop working whenever
# the app restarts, including DevTools restarts on save. For tokens that survive restarts, set a fixed
# local-only key instead (and remove ephemeral-key):
#   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 | tr -d '\n'
# keyra.jwt.key-id=local-dev
# keyra.jwt.private-key=<paste the output here>
keyra.jwt.ephemeral-key=true
