name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Tag must match the module version
        run: |
          v=$(sed -n 's/^ *keyra_version *= *"\(.*\)"/\1/p' infra/modules/keyra/gcp/main.tf)
          [ -n "$v" ] && [ "$GITHUB_REF_NAME" = "v$v" ] || { echo "tag $GITHUB_REF_NAME does not match keyra_version '$v'"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6.10.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/adamrodriguesss/keyra:${{ env.VERSION }}
            ghcr.io/adamrodriguesss/keyra:latest
