# Copy to compose.yaml (gitignored) for local development: cp compose.example.yaml compose.yaml
# Local development database. `./mvnw spring-boot:run` starts it automatically
# (spring-boot-docker-compose) and connects to it; `docker compose up -d` also works.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: keyra
      POSTGRES_USER: keyra
      POSTGRES_PASSWORD: keyra
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/, so mount the parent.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keyra -d keyra"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
