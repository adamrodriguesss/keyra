spring.application.name=keyra

spring.datasource.url=${KEYRA_DB_URL:}
spring.datasource.username=${KEYRA_DB_USER:}
spring.datasource.password=${KEYRA_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

keyra.issuer-url=${KEYRA_ISSUER_URL:}
keyra.jwt.private-key=${KEYRA_JWT_PRIVATE_KEY:}
keyra.jwt.key-id=${KEYRA_JWT_KEY_ID:}
keyra.bootstrap.admin-email=${KEYRA_BOOTSTRAP_ADMIN_EMAIL:}
keyra.bootstrap.admin-password=${KEYRA_BOOTSTRAP_ADMIN_PASSWORD:}
keyra.keys.rotation-grace=${KEYRA_KEY_ROTATION_GRACE_HOURS:24}h
