spring.application.name=keyra
server.port=${PORT:8080}

spring.datasource.url=${KEYRA_DB_URL:}
spring.datasource.username=${KEYRA_DB_USER:}
spring.datasource.password=${KEYRA_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${KEYRA_DB_POOL_SIZE:10}
# A fresh Cloud Run instance's egress can take ~40s to reach the database, so retry instead of exiting.
# Backoff doubles up to 10s: ~105s worst case, inside Cloud Run's 120s startup probe and ECS's 180s grace.
spring.flyway.connect-retries=6
spring.flyway.connect-retries-interval=10s
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

keyra.issuer-url=${KEYRA_ISSUER_URL:}
keyra.jwt.private-key=${KEYRA_JWT_PRIVATE_KEY:}
keyra.jwt.key-id=${KEYRA_JWT_KEY_ID:}
keyra.bootstrap.admin-email=${KEYRA_BOOTSTRAP_ADMIN_EMAIL:}
keyra.bootstrap.admin-password=${KEYRA_BOOTSTRAP_ADMIN_PASSWORD:}
keyra.keys.rotation-grace=${KEYRA_KEY_ROTATION_GRACE_HOURS:24}h

# Only health is exposed over HTTP, with liveness/readiness probes for the platform; SecurityConfig makes it public.
# Metrics are pushed over OTLP instead, when KEYRA_METRICS_ENABLED is set (off, so nothing looks for a collector).
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.otlp.metrics.export.enabled=${KEYRA_METRICS_ENABLED:false}
management.otlp.metrics.export.url=${KEYRA_METRICS_OTLP_URL:http://localhost:4318/v1/metrics}
management.otlp.metrics.export.step=60s
# p95 for the validation target; the 50ms SLO bucket makes "share under target" a direct query.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=50ms
