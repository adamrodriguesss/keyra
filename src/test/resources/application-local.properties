# spring-boot:test-run and integration tests. Integration tests load this file with test-level precedence
# (see IntegrationTest), so they don't depend on a developer's config/application.properties.
keyra.issuer-url=http://localhost:8080
keyra.jwt.ephemeral-key=true
keyra.bootstrap.admin-email=admin@keyra.local
keyra.bootstrap.admin-password=local-admin-password
# Postgres comes from Testcontainers here, not compose.yaml.
spring.docker.compose.enabled=false
